<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:'PlexSans';src:url('src/plex-sans.woff2') format('woff2');font-weight:100 700;}
@font-face{font-family:'PlexMono';src:url('src/plex-mono.woff2') format('woff2');font-weight:500;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0D1117}
.f{position:relative;width:1080px;height:1920px;
 background-image:linear-gradient(to right,rgba(64,80,100,.45) 1px,transparent 1px),
                  linear-gradient(to bottom,rgba(64,80,100,.45) 1px,transparent 1px);
 background-size:60px 60px}
/* Foto na metade inferior; o degradê funde no fundo em vez de cortar seco. */
.ph{position:absolute;left:0;bottom:0;width:1080px;height:1010px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50%% 26%%;filter:brightness(.82) contrast(1.14) saturate(.90);}
.ph::after{content:'';position:absolute;inset:0;
 background:linear-gradient(to bottom,#0D1117 0%,rgba(13,17,23,.45) 22%,rgba(13,17,23,0) 55%)}
/* Texto dentro da faixa 420-1500, que é o recorte quadrado da grade do perfil. */
.tx{position:absolute;left:80px;top:470px;width:920px}
.kicker{font-family:'PlexMono',monospace;font-size:34px;letter-spacing:.16em;
 text-transform:uppercase;color:#4DA3FF;margin-bottom:26px}
h1{font-family:'PlexSans',sans-serif;font-weight:700;font-size:132px;line-height:.98;
 color:#F3F6FA;letter-spacing:-.025em}
h1 em{font-style:normal;color:#4DA3FF}
.sub{margin-top:26px;font-family:'PlexMono',monospace;font-size:30px;letter-spacing:.10em;
 text-transform:uppercase;color:#7F8B99}
.wm{position:absolute;left:56px;top:150px;width:300px;opacity:.92}
.wm img{width:100%;display:block;transform:translateX(calc(-32 / 330 * 100%))}
.bar{position:absolute;left:0;bottom:0;height:10px;width:1080px;background:#4DA3FF}
</style></head><body><div class="f">
<div class="wm"><img src="src/wordmark.svg"></div>
<div class="ph"><img src="src/take1.png"></div>
<div class="tx"><div class="kicker">PRODUTOS REAIS COM IA</div><h1>SE DER<br><em>ZERO</em>,<br>EU MOSTRO.</h1><div class="sub">custo · receita · resultado</div></div><div class="bar"></div></div></body></html>
