<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:'PlexSans';src:url('src/plex-sans.woff2') format('woff2');font-weight:100 700;}
@font-face{font-family:'PlexMono';src:url('src/plex-mono.woff2') format('woff2');font-weight:500;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#0D1117}
.f{position:relative;width:1280px;height:720px;
  background-image:linear-gradient(to right,rgba(64,80,100,.45) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(64,80,100,.45) 1px,transparent 1px);
  background-size:48px 48px;}
/* Foto sangra pela direita; gradiente funde na cor de fundo em vez de cortar seco */
.ph{position:absolute;right:0;top:0;width:560px;height:720px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:52% 28%}
.ph::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to right,#0D1117 0%,rgba(13,17,23,.55) 26%,rgba(13,17,23,0) 62%)}
.tx{position:absolute;left:76px;top:0;height:720px;width:700px;
  display:flex;flex-direction:column;justify-content:center;gap:22px}
.kicker{font-family:'PlexMono',monospace;font-size:26px;letter-spacing:.16em;
  text-transform:uppercase;color:#4DA3FF}
h1{font-family:'PlexSans',sans-serif;font-weight:700;font-size:118px;line-height:.96;
  color:#F3F6FA;letter-spacing:-.025em}
h1 em{font-style:normal;color:#4DA3FF}
.sub{font-family:'PlexMono',monospace;font-size:25px;letter-spacing:.10em;
  text-transform:uppercase;color:#7F8B99}
.bar{position:absolute;left:0;bottom:0;height:8px;width:1280px;background:#4DA3FF}
</style></head><body><div class="f">
<div class="ph"><img src="src/foto.jpg"></div>
<div class="tx"><div class="kicker">PRODUTOS REAIS COM IA</div><h1>SE DER <em>ZERO</em>,<br>EU MOSTRO.</h1><div class="sub">custo · receita · resultado</div></div><div class="bar"></div></div></body></html>
